name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug gradlew
        run: |
          echo "=== gradlew head ==="
          head -5 gradlew | od -c
          echo "=== wrapper props ==="
          cat gradle/wrapper/gradle-wrapper.properties | od -c
          echo "=== java version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo $JAVA_HOME

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --info --stacktrace 2>&1 | head -100
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StretchRes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
